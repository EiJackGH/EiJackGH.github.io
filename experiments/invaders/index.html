<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="browser-unsupported.js"></script>
    <title>Lab: Space Invaders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #030303; color: #00FF00; font-family: 'Courier New', Courier, monospace; }
        .crt-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);
            border: 3px solid #00FF00;
            border-radius: 8px;
            overflow: hidden;
            background: black;
        }
        /* CRT overlay */
        .crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 10;
        }
        /* Retro glowing text */
        .glow-text {
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.8);
        }
        /* Custom retro button styling */
        .retro-btn {
            background: transparent;
            border: 2px solid #00FF00;
            color: #00FF00;
            padding: 6px 12px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 5px rgba(0, 255, 0, 0.3);
        }
        .retro-btn:hover {
            background: #00FF00;
            color: black;
            box-shadow: 0 0 15px #00FF00;
        }
        /* Control layout */
        .hud-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body class="p-4 flex flex-col min-h-screen justify-between">
    <noscript>
        <div style="background: #ff0000; color: white; padding: 20px; text-align: center; font-weight: bold; font-family: sans-serif;">
            ⚠️ JAVASCRIPT IS REQUIRED
            <p>This experiment uses the HTML5 Canvas API. Please enable JavaScript in your browser settings to play.</p>
            <a href="../../" style="color: yellow; text-decoration: underline;">Return to Homepage</a>
        </div>
    </noscript>

    <div class="max-w-2xl mx-auto w-full">
        <!-- Header -->
        <div class="flex justify-between items-center mb-4">
            <a href="../../" class="text-green-800 hover:text-green-400 font-bold transition">← BACK TO LAB</a>
            <button id="soundToggle" class="retro-btn font-bold">🔇 SOUNDS: OFF</button>
        </div>

        <h1 class="text-4xl font-extrabold text-center mb-6 glow-text tracking-widest">INVADERS v1.0</h1>
        
        <!-- HUD PANEL -->
        <div class="hud-panel font-bold px-2">
            <div>SCORE: <span id="score" class="text-white glow-text">0</span></div>
            <div id="livesContainer" class="flex items-center gap-1">
                LIVES:
                <span id="livesList" class="text-red-500 glow-text">❤️❤️❤️</span>
            </div>
        </div>

        <!-- CANVAS FRAME -->
        <div class="crt-container mx-auto" style="width: 600px; height: 400px;">
            <div class="crt-overlay"></div>
            <canvas id="gameCanvas" width="600" height="400" class="block"></canvas>
        </div>

        <!-- === MOBILE CONTROL LAYER === -->
        <div id="mobile-controls" style="display: none; justify-content: space-between; align-items: center; width: 100%; max-width: 600px; margin: 20px auto 0 auto; padding: 15px; box-sizing: border-box; touch-action: none; user-select: none; border: 2px dashed #00FF00; border-radius: 8px; background: rgba(0, 0, 0, 0.6);">
          <!-- Left: D-Pad / Joystick Area -->
          <div id="joystick" style="display: flex; gap: 15px;">
            <button id="left-btn" style="width: 65px; height: 65px; background: transparent; border: 2px solid #00FF00; border-radius: 50%; color: #00FF00; font-size: 24px; box-shadow: 0 0 8px rgba(0, 255, 0, 0.5); text-shadow: 0 0 5px #00FF00; outline: none;">◀</button>
            <button id="right-btn" style="width: 65px; height: 65px; background: transparent; border: 2px solid #00FF00; border-radius: 50%; color: #00FF00; font-size: 24px; box-shadow: 0 0 8px rgba(0, 255, 0, 0.5); text-shadow: 0 0 5px #00FF00; outline: none;">▶</button>
          </div>

          <!-- Right: Shoot Button -->
          <button id="shoot-btn" style="width: 80px; height: 80px; background: transparent; border: 2px solid #FF3333; border-radius: 50%; color: #FF3333; font-weight: bold; font-size: 16px; box-shadow: 0 0 8px rgba(255, 51, 51, 0.5); text-shadow: 0 0 5px #FF3333; outline: none;">FIRE</button>
        </div>

        <!-- FOOTER CONTROLS -->
        <div class="mt-4 text-center text-sm font-semibold tracking-wide text-green-500">
            <p class="mb-1">[LEFT / RIGHT ARROWS] to Move &nbsp;&bull;&nbsp; Hold [SPACE] to Shoot</p>
            <p class="text-xs text-gray-500">Experience true retro styling with procedural sounds, scrolling starfield, screen-shake and particles!</p>
        </div>
    </div>

    

    <!-- Retro Audio Controller (Web Audio API Synthesizer) -->
    <script>
        const AudioController = {
            enabled: false,
            ctx: null,

            init() {
                if (this.ctx) return;
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.enabled = true;
                    document.getElementById('soundToggle').innerText = "🔊 SOUNDS: ON";
                    document.getElementById('soundToggle').classList.add('bg-green-950');
                } catch (e) {
                    console.error("Web Audio API not supported", e);
                }
            },

            toggle() {
                if (!this.ctx) {
                    this.init();
                    return;
                }
                this.enabled = !this.enabled;
                const btn = document.getElementById('soundToggle');
                if (this.enabled) {
                    btn.innerText = "🔊 SOUNDS: ON";
                    btn.classList.add('bg-green-950');
                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                } else {
                    btn.innerText = "🔇 SOUNDS: OFF";
                    btn.classList.remove('bg-green-950');
                }
            },

            playShoot() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.12);

                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            },

            playSelect() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(750, this.ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            },

            playSelectConfirm() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                [523.25, 783.99].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.06, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.12);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.15);
                });
            },

            playEnemyShoot() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(350, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(150, this.ctx.currentTime + 0.15);

                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            },

            playExplosion() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(20, this.ctx.currentTime + 0.3);

                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.35);
            },

            playPlayerHit() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.5);

                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.5);
            },

            playVictory() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50]; // Beautiful C Major Ascending
                notes.forEach((freq, index) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(freq, now + index * 0.1);
                    gain.gain.setValueAtTime(0.06, now + index * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.1 + 0.2);
                    osc.start(now + index * 0.1);
                    osc.stop(now + index * 0.1 + 0.25);
                });
            },

            playGameOver() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [392.00, 311.13, 246.94, 196.00]; // Sad Descending minor chord
                notes.forEach((freq, index) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now + index * 0.2);
                    gain.gain.setValueAtTime(0.12, now + index * 0.2);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.2 + 0.4);
                    osc.start(now + index * 0.2);
                    osc.stop(now + index * 0.2 + 0.4);
                });
            }
        };

        document.getElementById('soundToggle').addEventListener('click', () => {
            AudioController.toggle();
        });
    </script>

    <!-- Main Game Script -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const livesListEl = document.getElementById('livesList');

        // Game State Variables
        let score = 0;
        let gameOver = false;
        let victory = false;
        let lives = 3;
        let gameState = 'team_select'; // 'team_select' or 'playing'
        let selectedTeamIndex = 0;     // 0 = Green, 1 = Crimson, 2 = Orion
        let hoveredTeamIndex = -1;

        // Visual effects state
        let screenShake = 0;
        const stars = [];
        const particles = [];

        // Cooldowns and parameters
        let lastShotTime = 0;
        let shotCooldown = 350; // milliseconds
        let lastEnemyShotTime = 0;
        const enemyShotCooldown = 1200; // how often enemies fire

        const player = {
            x: 275,
            y: 350,
            w: 50,
            h: 22,
            speed: 6,
            color: '#00FF00',
            bulletColor: '#FFFFFF',
            bulletSpeed: 7.5
        };

        // Retro Team / Faction Configurations
        const TEAMS = [
            {
                name: "GREEN SQUADRON",
                subName: "Earth Defense Force",
                color: "#00FF00",
                bulletColor: "#00FF00",
                speed: 5.5,
                shotCooldown: 350,
                bulletSpeed: 7.5,
                lives: 3,
                iconType: 'green_ship',
                perk: "Balanced all-rounder",
                stats: { speed: 3, fireRate: 3, power: 3 }
            },
            {
                name: "CRIMSON FLEET",
                subName: "Rebel Vanguard",
                color: "#FF3333",
                bulletColor: "#FF5555",
                speed: 4.5,
                shotCooldown: 450,
                bulletSpeed: 10.5, // High velocity
                lives: 4,          // Heavy armor, 4 lives
                iconType: 'crimson_ship',
                perk: "4 Lives & high velocity",
                stats: { speed: 2, fireRate: 2, power: 5 }
            },
            {
                name: "ORION SYNDICATE",
                subName: "Cyber Alliance",
                color: "#00FFFF",
                bulletColor: "#00FFFF",
                speed: 7.0,        // Agile speedster
                shotCooldown: 220, // Rapid-fire
                bulletSpeed: 6.5,
                lives: 2,          // Light shields, 2 lives
                iconType: 'orion_ship',
                perk: "Highly agile & rapid",
                stats: { speed: 5, fireRate: 5, power: 2 }
            }
        ];

        const bullets = [];         // Player bullets { x, y, w, h }
        const enemyBullets = [];    // Enemy bullets { x, y, w, h }
        const enemies = [];
        const keys = {};

        // Enemy Grid Settings
        const enemyRows = 3;
        const enemyCols = 8;
        const enemyW = 36;
        const enemyH = 22;
        let enemyDirection = 1; // 1 = right, -1 = left
        let enemySpeed = 1.0;
        let enemyDropAmount = 14;

        // Initialize stars
        for (let i = 0; i < 60; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.8 + 0.4,
                speed: Math.random() * 0.8 + 0.2
            });
        }

        // Create Enemy Grid
        // Row 0 = Squid, Row 1 = Crab, Row 2 = Octopus
        const enemyTypes = ['squid', 'crab', 'octopus'];
        for (let r = 0; r < enemyRows; r++) {
            for (let c = 0; c < enemyCols; c++) {
                enemies.push({
                    x: c * 55 + 65,
                    y: r * 35 + 50,
                    w: enemyW,
                    h: enemyH,
                    alive: true,
                    type: enemyTypes[r],
                    animationOffset: Math.random() * Math.PI // for retro wiggle
                });
            }
        }

        // Sprites definition (for high-fidelity drawing instead of solid blocks)
        const SPRITES = {
            squid: [
                "001100",
                "011110",
                "111111",
                "110011",
                "111111",
                "010101",
                "100001"
            ],
            crab: [
                "100001",
                "011110",
                "110111",
                "111111",
                "011110",
                "100001"
            ],
            octopus: [
                "011110",
                "111111",
                "110111",
                "111111",
                "010010",
                "101101"
            ]
        };

        // Event listeners
        document.addEventListener('keydown', e => {
            keys[e.code] = true;

            if (gameState === 'team_select') {
                // Prevent browser scrolls on Space/Arrows inside team select
                if (['ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                    e.preventDefault();
                }

                if (e.code === 'ArrowLeft') {
                    selectedTeamIndex = (selectedTeamIndex - 1 + 3) % 3;
                    AudioController.init();
                    AudioController.playSelect();
                } else if (e.code === 'ArrowRight') {
                    selectedTeamIndex = (selectedTeamIndex + 1) % 3;
                    AudioController.init();
                    AudioController.playSelect();
                } else if (e.code === 'Space' || e.code === 'Enter') {
                    confirmTeamSelection(selectedTeamIndex);
                } else if (e.code === 'Digit1') {
                    selectedTeamIndex = 0;
                    confirmTeamSelection(0);
                } else if (e.code === 'Digit2') {
                    selectedTeamIndex = 1;
                    confirmTeamSelection(1);
                } else if (e.code === 'Digit3') {
                    selectedTeamIndex = 2;
                    confirmTeamSelection(2);
                }
            }
        });
        document.addEventListener('keyup', e => keys[e.code] = false);

        // Mouse handling for canvas selection
        canvas.addEventListener('mousemove', (e) => {
            if (gameState !== 'team_select') {
                canvas.style.cursor = 'default';
                return;
            }
            const rect = canvas.getBoundingClientRect();
            // Scale coordinates in case CSS scales the canvas
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;

            let foundHover = -1;
            const cardY = 110;
            const cardH = 220;
            const cardW = 160;
            const startX = 40;
            const spacing = 20;

            for (let i = 0; i < 3; i++) {
                const x = startX + i * (cardW + spacing);
                if (mouseX >= x && mouseX <= x + cardW && mouseY >= cardY && mouseY <= cardY + cardH) {
                    foundHover = i;
                    break;
                }
            }

            if (foundHover !== hoveredTeamIndex) {
                hoveredTeamIndex = foundHover;
                if (hoveredTeamIndex !== -1) {
                    selectedTeamIndex = hoveredTeamIndex;
                    AudioController.init();
                    AudioController.playSelect();
                }
            }

            if (hoveredTeamIndex !== -1) {
                canvas.style.cursor = 'pointer';
            } else {
                canvas.style.cursor = 'default';
            }
        });

        canvas.addEventListener('click', (e) => {
            if (gameState !== 'team_select') return;
            if (hoveredTeamIndex !== -1) {
                confirmTeamSelection(hoveredTeamIndex);
            }
        });

        // Particle System
        function spawnExplosion(x, y, color) {
            const count = 12 + Math.floor(Math.random() * 8);
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1, // slight upwards bias
                    size: Math.random() * 2.5 + 1,
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.015,
                    color: color
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.restore();
            });
        }

        // Draw individual retro-pixel sprite
        function drawSprite(spriteName, x, y, width, height, color, wiggle = 0) {
            const sprite = SPRITES[spriteName];
            if (!sprite) return;
            const rows = sprite.length;
            const cols = sprite[0].length;
            const cellW = width / cols;
            const cellH = height / rows;

            ctx.fillStyle = color;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (sprite[r][c] === '1') {
                        // Apply custom movement (wiggle) for limbs on bottom rows
                        let offX = 0;
                        if (r >= rows - 2) {
                            offX = Math.sin(wiggle) * 1.5;
                        }
                        ctx.fillRect(x + c * cellW + offX, y + r * cellH, cellW + 0.5, cellH + 0.5);
                    }
                }
            }
        }

        function update() {
            if (gameState === 'team_select') return;
            if (gameOver || victory) return;

            // Screen Shake Decay
            if (screenShake > 0) {
                screenShake *= 0.9;
                if (screenShake < 0.2) screenShake = 0;
            }

            // Parallax Starfield Background
            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > canvas.height) {
                    s.y = 0;
                    s.x = Math.random() * canvas.width;
                }
            });

            // Player smooth horizontal movement
            if (keys['ArrowLeft'] && player.x > 5) {
                player.x -= player.speed;
            }
            if (keys['ArrowRight'] && player.x < canvas.width - player.w - 5) {
                player.x += player.speed;
            }

            // Player shooting with proper interval / hold support
            const now = Date.now();
            if (keys['Space']) {
                if (now - lastShotTime > shotCooldown) {
                    bullets.push({
                        x: player.x + player.w / 2 - 2,
                        y: player.y - 4,
                        w: 4,
                        h: 12
                    });
                    lastShotTime = now;
                    AudioController.playShoot();
                }
            }

            // Player Bullets logic
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.y -= player.bulletSpeed || 7.5; // moving up
                if (b.y < 0) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Check collision with enemies
                let hitAny = false;
                for (let j = 0; j < enemies.length; j++) {
                    const e = enemies[j];
                    if (e.alive && b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
                        e.alive = false;
                        spawnExplosion(e.x + e.w / 2, e.y + e.h / 2, '#FF5555');
                        bullets.splice(i, 1);
                        hitAny = true;
                        score += 10;
                        scoreEl.innerText = score;
                        AudioController.playExplosion();

                        // Speed up remaining enemies slightly
                        const remaining = enemies.filter(alien => alien.alive).length;
                        enemySpeed = 1.0 + (1.2 * (enemyRows * enemyCols - remaining) / (enemyRows * enemyCols));
                        break;
                    }
                }
                if (hitAny) continue;
            }

            // Enemy Movement (Classic step grid movement)
            let changeDirection = false;
            const borderBuffer = 12;

            enemies.forEach(e => {
                if (!e.alive) return;
                // Left or Right bounds hit
                if (enemyDirection === 1 && e.x + e.w > canvas.width - borderBuffer) {
                    changeDirection = true;
                } else if (enemyDirection === -1 && e.x < borderBuffer) {
                    changeDirection = true;
                }
            });

            if (changeDirection) {
                enemyDirection *= -1;
                enemies.forEach(e => {
                    if (e.alive) {
                        e.y += enemyDropAmount;
                        // If any enemy reaches player's baseline -> Game Over
                        if (e.y + e.h >= player.y) {
                            endTheGame(false);
                        }
                    }
                });
            } else {
                enemies.forEach(e => {
                    if (e.alive) {
                        e.x += enemyDirection * enemySpeed;
                    }
                });
            }

            // Enemy Shooting
            if (now - lastEnemyShotTime > enemyShotCooldown) {
                const aliveEnemies = enemies.filter(e => e.alive);
                if (aliveEnemies.length > 0) {
                    // Choose a random alive enemy to shoot
                    const shooter = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
                    enemyBullets.push({
                        x: shooter.x + shooter.w / 2 - 2,
                        y: shooter.y + shooter.h,
                        w: 4,
                        h: 12
                    });
                    lastEnemyShotTime = now;
                    AudioController.playEnemyShoot();
                }
            }

            // Enemy Bullets Logic
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const eb = enemyBullets[i];
                eb.y += 4.5; // moving down
                if (eb.y > canvas.height) {
                    enemyBullets.splice(i, 1);
                    continue;
                }

                // Collision with player
                if (eb.x < player.x + player.w && eb.x + eb.w > player.x && eb.y < player.y + player.h && eb.y + eb.h > player.y) {
                    enemyBullets.splice(i, 1);
                    lives--;
                    screenShake = 12;
                    spawnExplosion(player.x + player.w / 2, player.y + player.h / 2, '#00FF00');
                    AudioController.playPlayerHit();

                    // Update UI lives display
                    let lifeHearts = "";
                    for (let l = 0; l < lives; l++) {
                        lifeHearts += "❤️";
                    }
                    livesListEl.innerText = lifeHearts || "NONE";

                    if (lives <= 0) {
                        endTheGame(false);
                    }
                }
            }

            // Check Victory state
            if (enemies.every(e => !e.alive)) {
                endTheGame(true);
            }

            updateParticles();
        }

        function endTheGame(winState) {
            if (winState) {
                victory = true;
                AudioController.playVictory();
            } else {
                gameOver = true;
                AudioController.playGameOver();
            }
        }

        function draw() {
            ctx.save();
            // Apply screen shake effect
            if (screenShake > 0) {
                const dx = (Math.random() - 0.5) * screenShake;
                const dy = (Math.random() - 0.5) * screenShake;
                ctx.translate(dx, dy);
            }

            if (gameState === 'team_select') {
                drawTeamSelect();
                ctx.restore();
                return;
            }

            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Stars
            ctx.fillStyle = '#FFFFFF';
            stars.forEach(s => {
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });

            // Draw Player Tank (sleek vector design)
            ctx.fillStyle = player.color || '#00FF00';
            // Base layer
            ctx.fillRect(player.x, player.y + 11, player.w, 11);
            // Middle section
            ctx.fillRect(player.x + 8, player.y + 5, player.w - 16, 6);
            // Cannon turret
            ctx.fillRect(player.x + player.w / 2 - 3, player.y, 6, 5);

            // Draw Player Bullets
            ctx.fillStyle = player.bulletColor || '#FFFFFF';
            bullets.forEach(b => {
                ctx.fillRect(b.x, b.y, b.w, b.h);
            });

            // Draw Enemy Bullets (pulsating orange/yellow)
            ctx.fillStyle = '#FF9900';
            enemyBullets.forEach(eb => {
                ctx.fillRect(eb.x, eb.y, eb.w, eb.h);
            });

            // Draw Animated Enemies
            const time = Date.now() * 0.007;
            enemies.forEach(e => {
                if (e.alive) {
                    const wiggleVal = time + e.animationOffset;
                    drawSprite(e.type, e.x, e.y, e.w, e.h, '#FF3333', wiggleVal);
                }
            });

            // Particles
            drawParticles();

            // End states screens
            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#FF3333";
                ctx.font = "bold 44px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText("MISSION FAILED", canvas.width / 2, canvas.height / 2 - 25);

                ctx.font = "20px 'Courier New'";
                ctx.fillStyle = "#FFFFFF";
                ctx.fillText("FINAL SCORE: " + score, canvas.width / 2, canvas.height / 2 + 25);

                ctx.fillStyle = "#888888";
                ctx.font = "16px 'Courier New'";
                ctx.fillText("Press [R] to Restart Laboratory", canvas.width / 2, canvas.height / 2 + 75);
            }

            if (victory) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#00FF00";
                ctx.font = "bold 44px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText("MISSION COMPLETE", canvas.width / 2, canvas.height / 2 - 25);

                ctx.font = "20px 'Courier New'";
                ctx.fillStyle = "#FFFFFF";
                ctx.fillText("CONGRATULATIONS! SCORE: " + score, canvas.width / 2, canvas.height / 2 + 25);

                ctx.fillStyle = "#888888";
                ctx.font = "16px 'Courier New'";
                ctx.fillText("Press [R] to Restart Laboratory", canvas.width / 2, canvas.height / 2 + 75);
            }

            ctx.restore();
        }

        function drawTeamSelect() {
            // Draw background stars
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#FFFFFF';
            stars.forEach(s => {
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });

            // Pulsating Title "CHOOSE YOUR TEAM"
            const pulse = 1 + Math.sin(Date.now() * 0.005) * 0.04;
            ctx.save();
            ctx.translate(canvas.width / 2, 50);
            ctx.scale(pulse, pulse);
            ctx.font = "bold 28px 'Courier New'";
            ctx.textAlign = "center";
            // Shadow / Glow
            ctx.fillStyle = 'rgba(0, 255, 0, 0.25)';
            ctx.fillText("CHOOSE YOUR TEAM", 2, 2);
            ctx.fillStyle = '#00FF00';
            ctx.fillText("CHOOSE YOUR TEAM", 0, 0);
            ctx.restore();

            // Instructions text
            ctx.fillStyle = '#888888';
            ctx.font = "11px 'Courier New'";
            ctx.textAlign = "center";
            ctx.fillText("USE ARROW KEYS & ENTER, OR CLICK WITH MOUSE, OR PRESS [1, 2, 3]", canvas.width / 2, 85);

            // Draw Cards
            const cardY = 110;
            const cardH = 220;
            const cardW = 160;
            const startX = 40;
            const spacing = 20;

            TEAMS.forEach((team, idx) => {
                const x = startX + idx * (cardW + spacing);
                const isSelected = (idx === selectedTeamIndex);

                // Draw Card Box
                ctx.save();
                if (isSelected) {
                    ctx.fillStyle = "rgba(0, 255, 0, 0.05)";
                    ctx.fillRect(x, cardY, cardW, cardH);
                    ctx.strokeStyle = team.color;
                    ctx.lineWidth = 3;
                    ctx.shadowColor = team.color;
                    ctx.shadowBlur = 12;
                } else {
                    ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
                    ctx.fillRect(x, cardY, cardW, cardH);
                    ctx.strokeStyle = "#333333";
                    ctx.lineWidth = 1.5;
                }
                ctx.strokeRect(x, cardY, cardW, cardH);
                ctx.restore();

                // Draw Ship Preview inside Card
                const previewX = x + cardW / 2;
                const previewY = cardY + 35;
                ctx.fillStyle = team.color;

                ctx.save();
                ctx.translate(previewX, previewY);
                if (team.iconType === 'green_ship') {
                    // Standard sleek tank
                    ctx.fillRect(-20, 6, 40, 8);
                    ctx.fillRect(-12, 1, 24, 5);
                    ctx.fillRect(-3, -3, 6, 4);
                } else if (team.iconType === 'crimson_ship') {
                    // Winged, bulkier heavy ship
                    ctx.fillRect(-22, 2, 44, 10);
                    ctx.fillRect(-10, -4, 20, 6);
                    ctx.fillRect(-16, -1, 4, 4);
                    ctx.fillRect(12, -1, 4, 4);
                    ctx.fillRect(-2, -8, 4, 4);
                } else if (team.iconType === 'orion_ship') {
                    // Futuristic arrow/vessel
                    ctx.beginPath();
                    ctx.moveTo(0, -10);
                    ctx.lineTo(18, 10);
                    ctx.lineTo(5, 3);
                    ctx.lineTo(-5, 3);
                    ctx.lineTo(-18, 10);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.restore();

                // Team Name
                ctx.fillStyle = team.color;
                ctx.font = "bold 13px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText(team.name, x + cardW / 2, cardY + 75);

                ctx.fillStyle = "#888888";
                ctx.font = "9px 'Courier New'";
                ctx.fillText(team.subName, x + cardW / 2, cardY + 90);

                // Stats
                const statsY = cardY + 115;
                ctx.font = "9px 'Courier New'";
                ctx.textAlign = "left";

                const drawStatBar = (label, value, yOffset) => {
                    ctx.fillStyle = "#888888";
                    ctx.fillText(label, x + 15, statsY + yOffset);

                    const barX = x + 65;
                    const barY = statsY + yOffset - 7;
                    const maxBars = 5;
                    for (let b = 0; b < maxBars; b++) {
                        if (b < value) {
                            ctx.fillStyle = team.color;
                        } else {
                            ctx.fillStyle = "#222222";
                        }
                        ctx.fillRect(barX + b * 15, barY, 11, 6);
                    }
                };

                drawStatBar("AGILITY", team.stats.speed, 0);
                drawStatBar("FIRING ", team.stats.fireRate, 15);
                drawStatBar("ARMOR  ", team.stats.power, 30);

                // Perk / Description
                ctx.fillStyle = "#AAAAAA";
                ctx.font = "10px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText(team.perk, x + cardW / 2, cardY + 175);

                // Faction Select Button / Prompt inside Card
                const btnY = cardY + 192;
                ctx.save();
                if (isSelected) {
                    ctx.fillStyle = team.color;
                    ctx.fillRect(x + 15, btnY, cardW - 30, 18);
                    ctx.fillStyle = "#000000";
                    ctx.font = "bold 10px 'Courier New'";
                    ctx.fillText("READY!", x + cardW / 2, btnY + 12);
                } else {
                    ctx.strokeStyle = "#444444";
                    ctx.strokeRect(x + 15, btnY, cardW - 30, 18);
                    ctx.fillStyle = "#666666";
                    ctx.font = "10px 'Courier New'";
                    ctx.fillText("SELECT", x + cardW / 2, btnY + 12);
                }
                ctx.restore();
            });

            // Global Footer Tip
            ctx.fillStyle = "#666666";
            ctx.font = "11px 'Courier New'";
            ctx.textAlign = "center";
            ctx.fillText("Press SPACE or ENTER to Confirm Team Selection", canvas.width / 2, 360);
        }

        function confirmTeamSelection(index) {
            const team = TEAMS[index];
            player.color = team.color;
            player.bulletColor = team.bulletColor;
            player.speed = team.speed;
            player.bulletSpeed = team.bulletSpeed;
            shotCooldown = team.shotCooldown;
            lives = team.lives;

            // Update the UI lives display immediately
            let lifeHearts = "";
            for (let l = 0; l < lives; l++) {
                lifeHearts += "❤️";
            }
            document.getElementById('livesList').innerText = lifeHearts || "NONE";

            // Initialize AudioController if not yet active
            AudioController.init();
            if (AudioController.playSelectConfirm) {
                AudioController.playSelectConfirm();
            } else {
                AudioController.playVictory();
            }

            // Set cooldown to avoid instant fire
            lastShotTime = Date.now() + 200;

            gameState = 'playing';
        }

        // Restart with Key R
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyR' && (gameOver || victory)) {
                location.reload();
            }
        });

        // Game Loop
        function tick() {
            update();
            draw();
            requestAnimationFrame(tick);
        }

        // Auto-init sound on first interaction
        window.addEventListener('keydown', () => {
            if (AudioController.enabled && AudioController.ctx && AudioController.ctx.state === 'suspended') {
                AudioController.ctx.resume();
            }
        }, { once: true });

        // Touch capacity check to show mobile controls
        const isTouchDevice = () => {
            return (('ontouchstart' in window) ||
                (navigator.maxTouchPoints > 0) ||
                (navigator.msMaxTouchPoints > 0));
        };

        if (isTouchDevice()) {
            document.getElementById('mobile-controls').style.display = 'flex';
        }

        tick();

        // Helper to map touches to game state
        const bindControl = (el, prop, val) => {
            el.addEventListener('touchstart', (e) => {
                e.preventDefault();
                keys[prop] = val;
            }, { passive: false });
            el.addEventListener('touchend', (e) => {
                e.preventDefault();
                keys[prop] = !val;
            }, { passive: false });
        };

        bindControl(document.getElementById('left-btn'), 'ArrowLeft', true);
        bindControl(document.getElementById('right-btn'), 'ArrowRight', true);
        bindControl(document.getElementById('shoot-btn'), 'Space', true);
    </script>
</body>
</html>
