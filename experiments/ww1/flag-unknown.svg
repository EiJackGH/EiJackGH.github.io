<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <!-- Flag Background / Field -->
  <rect width="600" height="400" fill="#3a3d40" />
  
  <!-- Subtle Vintage/Military Border -->
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#232527" stroke-width="8" />

  <!-- Center Emblem Circle -->
  <circle cx="300" cy="200" r="110" fill="#1e2022" stroke="#5a5e63" stroke-width="6" />

  <!-- Question Mark Symbol -->
  <text 
    x="300" 
    y="245" 
    font-family="'Georgia', 'Times New Roman', serif" 
    font-size="160" 
    font-weight="bold" 
    fill="#d9d9d9" 
    text-anchor="middle">?</text>
</svg>
