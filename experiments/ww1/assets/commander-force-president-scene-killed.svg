<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Dark tragic background gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0807" />
      <stop offset="60%" stop-color="#1b1210" />
      <stop offset="100%" stop-color="#2d0c0a" />
    </linearGradient>

    <!-- Glowing muzzle flash -->
    <linearGradient id="flash-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ffeb3b" />
      <stop offset="70%" stop-color="#ff5722" />
      <stop offset="100%" stop-color="#7f0000" stop-opacity="0" />
    </linearGradient>

    <!-- Gold details gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="50%" stop-color="#f5b041" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>

    <!-- Standard glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Heavy red alarm glow -->
    <filter id="heavy-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer frame with dark border -->
  <rect width="400" height="300" rx="12" fill="url(#bg-grad)" stroke="#4a1512" stroke-width="3" />

  <!-- Dramatic red battlefield glow/vignette at the bottom -->
  <ellipse cx="200" cy="300" rx="180" ry="90" fill="#b71c1c" opacity="0.3" filter="url(#heavy-glow)" />

  <!-- Background Battlefield Elements: barbed wire and crosses -->
  <g stroke="#261a15" stroke-width="2" fill="none" stroke-linecap="round">
    <!-- Distant ruined wooden posts -->
    <path d="M 50 250 L 50 210 M 44 220 L 56 220" />
    <path d="M 170 255 L 170 225 M 165 233 L 175 233" opacity="0.6" />
    <!-- Barbed wire fence threads -->
    <path d="M 100 250 Q 125 220 150 245 T 200 240" />
    <path d="M 95 240 Q 120 210 145 235 T 195 230" opacity="0.5" />
  </g>

  <!-- Trench Ground Silhouettes -->
  <path d="M 0 255 L 90 245 L 150 258 L 220 242 L 310 262 L 400 248 L 400 300 L 0 300 Z" fill="#130b09" />
  <path d="M 0 265 L 110 255 L 170 268 L 260 255 L 340 272 L 400 260 L 400 300 L 0 300 Z" fill="#090504" />

  <!-- ENEMY ATTACKER SIDE (Left) -->
  <g id="enemy-attacker">
    <!-- Trench parapet highlight -->
    <path d="M -10 250 L 80 245" stroke="#2a1813" stroke-width="4" fill="none" />

    <!-- Enemy machine gun silhouette (Maxim MG08) -->
    <!-- Sled/Tripod Mount -->
    <path d="M 20 255 L 42 224 L 55 248 M 42 224 L 32 255" stroke="#110d0c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Gun cooling jacket/body -->
    <rect x="25" y="215" width="48" height="12" rx="2" fill="#1b1614" stroke="#0a0807" stroke-width="1.5" transform="rotate(-6 45 220)" />
    <rect x="15" y="217" width="12" height="9" fill="#110d0c" stroke="#0a0807" stroke-width="1" transform="rotate(-6 45 220)" />
    <!-- Water condenser hose and details -->
    <path d="M 32 227 Q 25 242 35 252" stroke="#110d0c" stroke-width="1.5" fill="none" />
    <!-- Gun barrel tip -->
    <line x1="72" y1="215" x2="79" y2="214" stroke="#0a0807" stroke-width="3" stroke-linecap="round" />

    <!-- Firing Muzzle Flash -->
    <polygon points="78,214 112,190 102,213 135,214 102,219 116,236 78,216" fill="url(#flash-grad)" filter="url(#glow)" />
    <polygon points="78,214 96,204 92,213 110,214 92,216 98,222 78,216" fill="#ffffff" />
  </g>

  <!-- BULLET TRACER PATHS -->
  <g stroke-linecap="round" opacity="0.85">
    <!-- Core Tracer Bullet -->
    <line x1="120" y1="214" x2="235" y2="152" stroke="#fff59d" stroke-width="2" stroke-dasharray="18, 18" filter="url(#glow)" />
    <!-- Secondary shockwave paths -->
    <line x1="135" y1="214" x2="230" y2="160" stroke="#ff3d00" stroke-width="1" stroke-dasharray="8, 22" />
    <line x1="110" y1="214" x2="238" y2="144" stroke="#ff9100" stroke-width="1" stroke-dasharray="12, 16" opacity="0.6" />
  </g>

  <!-- COMMANDER FORCE PRESIDENT (Right) -->
  <g id="commander-president" transform="translate(10, 0)">
    <!-- Swagger stick / Commander baton slipping from hand -->
    <g id="falling-baton">
      <line x1="310" y1="180" x2="340" y2="215" stroke="url(#gold-grad)" stroke-width="3" stroke-linecap="round" />
      <!-- Motion lines -->
      <path d="M 305 175 Q 312 170 310 162" stroke="#ffffff" stroke-width="1" opacity="0.3" fill="none" />
      <path d="M 338 210 Q 345 205 343 197" stroke="#ffffff" stroke-width="1" opacity="0.3" fill="none" />
    </g>

    <!-- Commander's Coat & Body Silhouette (leaning back, collapsing) -->
    <!-- Back, legs, coat skirt -->
    <path d="M 285 255 L 295 210 L 325 185 L 290 180 L 265 220 L 255 255 Z" fill="#182330" stroke="#0d141d" stroke-width="2" />
    <path d="M 290 180 L 250 140 L 285 130 L 305 170 Z" fill="#243348" stroke="#0d141d" stroke-width="2" />

    <!-- Red sash of supreme leadership / President -->
    <path d="M 252 142 L 298 178" stroke="#c62828" stroke-width="6" stroke-linecap="round" />
    <path d="M 252 142 L 298 178" stroke="#e53935" stroke-width="2" stroke-linecap="round" />

    <!-- Golden epaulet on left shoulder -->
    <path d="M 282 131 C 285 125, 292 125, 295 132" stroke="url(#gold-grad)" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 295 132 L 302 138" stroke="url(#gold-grad)" stroke-width="2" stroke-linecap="round" />

    <!-- Golden epaulet on right shoulder (foreshortened) -->
    <path d="M 248 141 C 246 136, 250 134, 254 139" stroke="url(#gold-grad)" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- President's Suit Collar and Golden Tie/Medal -->
    <polygon points="262,142 268,142 265,152" fill="url(#gold-grad)" />
    <polygon points="258,136 264,136 261,142" fill="#ffffff" />

    <!-- Chest Medals (Presidential / Supreme Commander decorations) -->
    <g id="medals" transform="translate(268, 144)">
      <!-- Ribbon bar -->
      <rect x="0" y="0" width="14" height="4" fill="#000000" rx="1" />
      <rect x="1" y="1" width="3" height="2" fill="#d32f2f" />
      <rect x="5" y="1" width="3" height="2" fill="#ffffff" />
      <rect x="9" y="1" width="4" height="2" fill="#1565c0" />
      <!-- Hanging Gold Star Medal -->
      <polygon points="7,4 9,8 12,8 9,10 11,14 7,11 3,14 5,10 2,8 5,8" fill="url(#gold-grad)" stroke="#996500" stroke-width="0.5" />
    </g>

    <!-- Right arm clutching the chest wound -->
    <path d="M 250 140 Q 225 155 220 172 Q 225 180 242 165 L 255 152" fill="#243348" stroke="#0d141d" stroke-width="2" stroke-linejoin="round" />
    <!-- Hand on chest -->
    <path d="M 248 150 Q 256 142 258 148 Q 254 154 248 152 Z" fill="#f5cba7" stroke="#0d141d" stroke-width="1" />

    <!-- Left arm thrown back in tragic agony -->
    <path d="M 285 130 Q 320 135 338 115 Q 345 120 340 130 Q 320 148 298 146 Z" fill="#243348" stroke="#0d141d" stroke-width="2" stroke-linejoin="round" />
    <!-- Left Hand open and finger splayed -->
    <path d="M 338 115 Q 346 108 348 112 Q 345 118 340 118 M 344 113 Q 349 110 351 114 M 342 117 Q 348 118 346 122" stroke="#f5cba7" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Neck -->
    <line x1="265" y1="130" x2="272" y2="114" stroke="#f5cba7" stroke-width="7" stroke-linecap="round" />

    <!-- Head tilted backward in pain -->
    <circle cx="274" cy="110" r="10" fill="#f5cba7" stroke="#0d141d" stroke-width="1.5" />
    <!-- Screaming/gasping open mouth profile and nose -->
    <path d="M 266 112 L 264 110 L 268 107 M 265 113 Q 268 116 270 114" stroke="#0d141d" stroke-width="1.5" fill="none" />

    <!-- Presidential Commander's Peaked Cap -->
    <!-- Cap peak/visor pointing up-left -->
    <path d="M 264 105 Q 255 106 251 109 L 260 112 Z" fill="#111111" stroke="#000000" stroke-width="1" />
    <!-- Cap body (deep navy blue with red piping band) -->
    <path d="M 263 105 L 285 98 L 290 106 L 268 112 Z" fill="#182330" />
    <path d="M 265 109 L 287 102" stroke="#c62828" stroke-width="1.5" />
    <!-- Cap top (high peaked back crown, military style) -->
    <path d="M 263 105 Q 265 85 288 88 L 285 98 Z" fill="#243348" stroke="#0d141d" stroke-width="1.5" />
    <!-- Supreme Gold Star Badge on Cap front -->
    <polygon points="268,102 270,105 273,105 271,107 272,110 269,108 266,110 267,107 265,105 268,105" fill="url(#gold-grad)" />
  </g>

  <!-- HEART IMPACT FLASH & TRAGIC BLOOD ERUPTION -->
  <g id="impact-and-blood" transform="translate(10, 0)">
    <!-- Glowing Impact point directly on the chest/sash -->
    <polygon points="254,146 242,141 251,149 240,152 252,154 246,164 256,156 261,166 259,151 268,146 256,145" fill="#ffffff" filter="url(#glow)" />
    <circle cx="254" cy="149" r="6" fill="#ffff8d" opacity="0.9" filter="url(#glow)" />

    <!-- Main Blood Splatters spraying backward (rightward) and upwards -->
    <!-- Backwards spray path -->
    <path d="M 256 149 C 280 120, 315 115, 345 85 C 330 115, 295 135, 258 153 Z" fill="#800000" opacity="0.95" />
    <path d="M 256 149 C 272 132, 300 128, 325 105 C 315 125, 290 138, 258 152 Z" fill="#d32f2f" opacity="0.95" />

    <!-- Secondary forward splash -->
    <path d="M 252 147 C 240 143, 235 135, 230 130 C 238 138, 244 144, 252 149 Z" fill="#c62828" opacity="0.85" />

    <!-- Airborne blood droplets -->
    <circle cx="280" cy="122" r="3.5" fill="#800000" />
    <circle cx="295" cy="115" r="2.5" fill="#d32f2f" />
    <circle cx="318" cy="98" r="4.5" fill="#800000" />
    <circle cx="330" cy="92" r="3" fill="#d32f2f" />
    <circle cx="348" cy="78" r="2" fill="#d32f2f" />
    <circle cx="265" cy="132" r="2" fill="#d32f2f" />
    <circle cx="305" cy="130" r="3" fill="#800000" />
    <circle cx="328" cy="120" r="2" fill="#d32f2f" />
  </g>

  <!-- MILITARY STENCIL HEADER TEXT (Tragic Announcement) -->
  <g id="header-text" filter="url(#glow)">
    <!-- Warning background banner strip -->
    <rect x="50" y="28" width="300" height="24" fill="#000000" opacity="0.6" rx="4" />
    <text x="200" y="44" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="900" fill="#e53935" text-anchor="middle" letter-spacing="2">★ COMMANDER-IN-CHIEF FALLEN ★</text>
  </g>

  <!-- Cracks on the screen / bullet impact overlay representing "Defeat" lens -->
  <g stroke="#ffffff" stroke-width="0.75" opacity="0.25" fill="none">
    <path d="M 264 149 L 285 160 L 305 155 M 285 160 L 295 180" />
    <path d="M 264 149 L 245 138 L 225 142 M 245 138 L 235 120" />
    <path d="M 264 149 L 270 130 L 265 115 M 270 130 L 290 120" />
  </g>

  <!-- Outer frame metallic rivets for WW1 steam-punk aesthetic -->
  <g fill="#4a1512" opacity="0.8">
    <circle cx="10" cy="10" r="2" />
    <circle cx="390" cy="10" r="2" />
    <circle cx="10" cy="290" r="2" />
    <circle cx="390" cy="290" r="2" />
    <circle cx="200" cy="10" r="2" />
    <circle cx="200" cy="290" r="2" />
    <circle cx="10" cy="150" r="2" />
    <circle cx="390" cy="150" r="2" />
  </g>
</svg>
