<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Vintage Explosive Fireball with Smoke and Shrapnel -->
  <!-- Outer Smoke/Dust Cloud -->
  <path d="M 50 15
           C 65 10, 80 25, 75 40
           C 85 45, 90 60, 80 75
           C 75 85, 60 90, 50 85
           C 40 90, 25 85, 20 75
           C 10 60, 15 45, 25 40
           C 20 25, 35 10, 50 15 Z"
        fill="#4d3c35" opacity="0.6" />

  <!-- Dark Fire/Smoke Layer -->
  <path d="M 50 25
           C 60 20, 75 30, 70 45
           C 80 50, 82 65, 72 75
           C 65 80, 55 80, 50 75
           C 45 80, 35 80, 28 75
           C 18 65, 20 50, 30 45
           C 25 30, 40 20, 50 25 Z"
        fill="#8c4327" opacity="0.85" />

  <!-- Fire / Explosion Burst (Orange) -->
  <path d="M 50 32 L 56 42 L 67 36 L 62 48 L 74 50 L 63 56 L 69 68 L 57 62 L 54 74 L 46 74 L 43 62 L 31 68 L 37 56 L 26 50 L 38 48 L 33 36 L 44 42 Z"
        fill="#d96b27" />

  <!-- Bright Core (Yellow) -->
  <path d="M 50 38 L 54 45 L 62 42 L 58 50 L 66 52 L 58 56 L 61 64 L 53 60 L 50 68 L 47 60 L 39 64 L 42 56 L 34 52 L 42 50 L 38 42 L 46 45 Z"
        fill="#f7cd46" />

  <!-- White Hot Center -->
  <circle cx="50" cy="52" r="8" fill="#ffffff" />

  <!-- Flying Shrapnel/Debris -->
  <path d="M 30 25 L 25 22 L 28 28 Z" fill="#1e1816" />
  <path d="M 72 28 L 76 24 L 70 22 Z" fill="#1e1816" />
  <path d="M 80 62 L 85 66 L 82 58 Z" fill="#1e1816" />
  <path d="M 22 68 L 18 72 L 20 64 Z" fill="#1e1816" />
  <path d="M 48 10 L 52 8 L 50 12 Z" fill="#1e1816" />
</svg>
