<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <!-- Solid White Background -->
  <rect width="300" height="200" fill="#ffffff"/>
  
  <!-- 16 Rays Geometry originating from the off-center disc -->
  <g fill="#bc002d">
    <!-- Path maps overlapping triangle rays converging at (100, 100) -->
    <path d="M100,100 L0,0 L0,36 Z"/>
    <path d="M100,100 L0,69 L0,107 Z"/>
    <path d="M100,100 L0,144 L0,183 Z"/>
    <path d="M100,100 L0,200 L44,200 Z"/>
    <path d="M100,100 L94,200 L141,200 Z"/>
    <path d="M100,100 L191,200 L242,200 Z"/>
    <path d="M100,100 L293,200 L300,200 L300,175 Z"/>
    <path d="M100,100 L300,136 L300,103 Z"/>
    <path d="M100,100 L300,69 L300,34 Z"/>
    <path d="M100,100 L300,0 L261,0 Z"/>
    <path d="M100,100 L213,0 L166,0 Z"/>
    <path d="M100,100 L117,0 L71,0 Z"/>
    <path d="M100,100 L300,200 L300,0 Z" opacity="0"/> <!-- Bound anchor -->
  </g>
  
  <!-- Main Off-Center Crimson Sun Disc (Centered at 1/3 width) -->
  <circle cx="100" cy="100" r="40" fill="#bc002d"/>
</svg>
