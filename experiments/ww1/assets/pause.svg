<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Styled Minimalist Pause Icon matching Great War theme -->
  <g fill="none" stroke="#2d2522" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Circular Shield Background / Frame -->
    <circle cx="50" cy="50" r="42" fill="#1e1816" stroke="#4d3e38" stroke-width="4" />
    <!-- Outer concentric ring -->
    <circle cx="50" cy="50" r="35" stroke="#3d312b" stroke-width="2" />
    <!-- Two vertical thick bar lines representing pause, matching accent color or brass theme -->
    <rect x="38" y="32" width="8" height="36" rx="2" fill="#c5a059" stroke="#1d1715" stroke-width="1.5" />
    <rect x="54" y="32" width="8" height="36" rx="2" fill="#c5a059" stroke="#1d1715" stroke-width="1.5" />
  </g>
</svg>
