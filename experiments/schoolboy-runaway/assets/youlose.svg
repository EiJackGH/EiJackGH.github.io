<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <!-- Background with dark spooky glow -->
  <defs>
    <radialGradient id="spooky-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#991b1b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="horror-blur">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <rect width="500" height="200" fill="url(#spooky-glow)" />

  <!-- Bloody drips/splatters -->
  <g fill="#7f1d1d">
    <!-- Left drip -->
    <path d="M 60 40 Q 70 80 65 110 Q 60 130 55 110 Q 50 80 60 40 Z" />
    <!-- Center-left drip -->
    <path d="M 120 40 Q 125 100 120 135 Q 115 150 110 135 Q 105 100 120 40 Z" />
    <!-- Center-right drip -->
    <path d="M 380 40 Q 385 110 380 145 Q 375 160 370 145 Q 365 110 380 40 Z" />
    <!-- Right drip -->
    <path d="M 440 40 Q 450 70 445 100 Q 440 120 435 100 Q 430 70 440 40 Z" />
  </g>

  <!-- Spooky stylized "YOU LOSE" text -->
  <g text-anchor="middle" font-family="'Creepster', 'Impact', sans-serif">
    <!-- Red glow/shadow text -->
    <text x="250" y="125" font-size="72" fill="#ef4444" filter="url(#horror-blur)" letter-spacing="8" font-weight="900" opacity="0.8">YOU LOSE</text>
    <!-- Sharp blood red foreground text -->
    <text x="250" y="120" font-size="72" fill="#dc2626" letter-spacing="8" font-weight="900" stroke="#000" stroke-width="2">YOU LOSE</text>
  </g>

  <!-- Splatter dots -->
  <circle cx="90" cy="115" r="4" fill="#7f1d1d" />
  <circle cx="130" cy="148" r="6" fill="#7f1d1d" />
  <circle cx="125" cy="160" r="3" fill="#7f1d1d" />
  <circle cx="365" cy="155" r="5" fill="#7f1d1d" />
  <circle cx="410" cy="95" r="3" fill="#7f1d1d" />
</svg>
